name: Baseline Launcher3 APK

on:
  push:
    branches:
      - build/baseline-apk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher3-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Launcher3 in AOSP-style layout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: android/packages/apps/Launcher3
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Inspect Android SDK and AOSP prerequisites
        working-directory: android/packages/apps/Launcher3
        shell: bash
        run: |
          echo "Launcher3 source revision: ${GITHUB_SHA}"
          echo "Java:"
          java -version
          echo "Android SDK: ${ANDROID_HOME:-not set}"
          echo "SDK platforms:"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>/dev/null || true
          echo "SDK tools:"
          command -v sdkmanager || true
          echo "SystemUI submodule:"
          git submodule status
          echo "Expected AOSP framework prebuilts:"
          ls -la ../../../prebuilts/framework_intermediates 2>/dev/null || true
          echo "Plugin core library:"
          ls -la ../../../prebuilts/framework_intermediates/libs/plugin_core.jar 2>/dev/null || true

      - name: Build baseline AOSP launcher without Quickstep
        working-directory: android/packages/apps/Launcher3
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain --stacktrace assembleAospWithoutQuickstepDebug

      - name: Verify APK output
        working-directory: android/packages/apps/Launcher3
        shell: bash
        run: |
          APK="build/outputs/apk/aospWithoutQuickstep/debug/Launcher3-aosp-withoutQuickstep-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "Expected APK not found. Available APK outputs:"
            find build/outputs/apk -type f -name "*.apk" -print 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher3-baseline-aosp-without-quickstep
          path: android/packages/apps/Launcher3/build/outputs/apk/aospWithoutQuickstep/debug/*.apk
          if-no-files-found: error
          retention-days: 14
