[versions]
agp = "8.13.2"
kotlin = "2.4.10"
androidx-lifecycle = "2.11.0"
androidx-core = "1.15.0"
androidx-dynamicanimation = "1.0.0"
androidx-recyclerview = "1.4.0"
androidx-preference = "1.2.1"
androidx-cardview = "1.0.0"
androidx-constraintlayout = "2.2.0"
androidx-fragment = "1.8.6"
androidx-slice-view = "1.0.0"
androidx-window = "1.3.0"
material = "1.12.0"
lottie = "6.6.2"
protobuf = "4.29.3"
dagger = "2.51.1"
guava = "33.4.0-android"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-dynamicanimation = { module = "androidx.dynamicanimation:dynamicanimation", version.ref = "androidx-dynamicanimation" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "androidx-preference" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "androidx-cardview" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }
androidx-slice-view = { module = "androidx.slice:slice-view", version.ref = "androidx-slice-view" }
androidx-window = { module = "androidx.window:window", version.ref = "androidx-window" }
material = { module = "com.google.android.material:material", version.ref = "material" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

androidx-test-rules = "androidx.test:rules:1.7.0"
androidx-junit = "androidx.test.ext:junit:1.3.0"

kotlinx-coroutines-android = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
protobuf = "com.google.protobuf:0.10.0"


