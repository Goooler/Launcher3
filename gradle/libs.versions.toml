[versions]
agp = "8.9.0"
kotlin = "2.1.10"
lifecycle = "2.8.7"
okhttp = "4.12.0"
retrofit = "2.11.0"

[libraries]
androidx-core-ktx = "androidx.core:core-ktx:1.15.0"
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = "androidx.activity:activity-compose:1.10.1"
androidx-compose-bom = "androidx.compose:compose-bom:2025.02.00"
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = "androidx.navigation:navigation-compose:2.8.8"
androidx-paging-compose = "androidx.paging:paging-compose:3.3.6"

kotlinx-coroutines-android = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1"
kotlinx-serialization-json = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0"

retrofit-retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinxSerialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp-okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logInterceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
networkresult = "at.connyduck:networkresult-calladapter:1.2.0"

ktlint = "com.pinterest.ktlint:ktlint-cli:1.5.0"
composeRules = "io.nlopez.compose.rules:ktlint:0.4.22"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
protobuf = "com.google.protobuf:0.9.4"
detekt = "io.gitlab.arturbosch.detekt:1.23.8"
spotless = "com.diffplug.spotless:7.0.2"